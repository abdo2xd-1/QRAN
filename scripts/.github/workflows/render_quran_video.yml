name: Quran Video Automation Engine

on:
  workflow_dispatch:
    inputs:
      audio_url:
        description: 'Direct MP3 Audio URL'
        required: true
        default: 'https://server10.mp3quran.net/minsh/002.mp3'

jobs:
  build-and-render:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # أقصى حد متاح (6 ساعات)

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: |
          pip install requests

      - name: Execute Video Rendering
        env:
          AUDIO_URL: ${{ github.event.inputs.audio_url }}
        run: |
          python scripts/render.py

      - name: Upload Output Video as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: quran-video-output
          path: final_output.mp4
          retention-days: 3
