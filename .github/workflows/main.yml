  schedule:
    - cron: '0 */2 * * *'
    - cron: '0 11 * * 5'

jobs:
  build-and-publish-long-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget

    - name: Install Playwright
      run: |
        pip install playwright
        playwright install --with-deps chromium

    - name: Create, Process and Upload Video via Cookies
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        SELECTED_SHEIKH: ${{ github.event.inputs.sheikh_choice }}
        SELECTED_SURAH: ${{ github.event.inputs.surah_name }}
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import urllib.request
        import json
        import random
        from datetime import datetime, timezone, timedelta
        from playwright.sync_api import sync_playwright

        event_name = os.environ.get("GITHUB_EVENT_NAME", "schedule")
        target_surah_id = None
        surah_name = ""
        target_name_search = ""

        if event_name == "workflow_dispatch":
            print("=== وضع التشغيل اليدوي ===")
            sheikh_input = os.environ.get("SELECTED_SHEIKH", "المنشاوي")
            surah_input = os.environ.get("SELECTED_SURAH", "سورة الكهف")
            target_name_search = surah_input.replace("سورة", "").strip()
            
            server_folder = "dsri" if sheikh_input == "الدوسري" else "minsh"
            sheikh_name_ar = "الشيخ ياسر بن راشد الدوسري" if sheikh_input == "الدوسري" else "الشيخ محمد صديق المنشاوي"
            sheikh_tag = sheikh_input
        else:
            print("=== وضع التشغيل التلقائي المجدول ===")
            utc_now = datetime.now(timezone.utc)
            local_now = utc_now + timedelta(hours=2)
            current_day = local_now.strftime("%A")
            current_hour = local_now.hour
            
            server_folder = random.choice(["minsh", "dsri"])
            sheikh_name_ar = "الشيخ ياسر بن راشد الدوسري" if server_folder == "dsri" else "الشيخ محمد صديق المنشاوي"
            sheikh_tag = "الدوسري" if server_folder == "dsri" else "المنشاوي"

            if (current_day == "Thursday" and current_hour == 20) or (current_day == "Friday" and current_hour == 13):
                target_surah_id = "018"
            else:
                target_surah_id = str(random.randint(1, 114)).zfill(3)

        image_filename = "base_room_empty.jpg"
        if not os.path.exists(image_filename):
            print("خطأ: الصورة base_room_empty.jpg غير موجودة!")
            exit(1)

        api_url = "https://www.mp3quran.net/api/v3/suwar"
        req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
        
        try:
            with urllib.request.urlopen(req) as response:
                data = json.loads(response.read().decode('utf-8'))
                for s in data.get('suwar', []):
                    if event_name == "workflow_dispatch":
                        if target_name_search in s['name']:
                            target_surah_id = str(s['id']).zfill(3)
                            surah_name = f"سورة {s['name']}"
                            break
                    else:
                        if str(s['id']).zfill(3) == target_surah_id:
                            surah_name = f"سورة {s['name']}"
                            break
        except Exception as e:
            print(f"خطأ في جلب البيانات: {e}")
            exit(1)

        audio_url = f"https://server10.mp3quran.net/{server_folder}/{target_surah_id}.mp3"
        local_filename = f"{surah_name}.mp3"
        print(f"جاري تحميل التلاوة لـ {surah_name}...")
        urllib.request.urlretrieve(audio_url, local_filename)

        final_video = f"video_{target_surah_id}.mp4"

        ffmpeg_cmd = [
            "ffmpeg", "-loop", "1", "-i", image_filename, "-i", local_filename,
            "-vf", "noise=alls=20:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.6,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
            "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
            "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
        ]
        subprocess.run(ffmpeg_cmd)

        custom_phrases = {
            "سورة الفاتحة": "أم الكتاب والشفاء التام لكل داء",
            "سورة البقرة": "سنام القرآن البركة الكبرى وطريدة الشياطين",
            "سورة الكهف": "راحة للقلوب ونور ما بين الجمعتين",
            "سورة يس": "قلب القرآن لتفريج الهموم وقضاء الحوائج",
            "سورة الملك": "المُنجية من عذاب القبر وشفيعة لصاحبها",
            "سورة الرحمن": "عروس القرآن لبيان نعم الله التي لا تُحصى",
            "سورة الواقعة": "جالبة الرزق والبركة ومانعة الفقر"
        }

        surah_phrase = custom_phrases.get(surah_name, "تلاوة خاشعة تريح القلوب وتطمئن النفوس")
        video_title = f"{surah_name} كاملة بصوت {sheikh_name_ar} | {surah_phrase}"
        video_description = f"استمع بقلبك إلى تلاوة مباركة لـ {surah_name} كاملة بصوت القارئ {sheikh_name_ar}.\n{surah_phrase}.\n\nلا تنسوا دعمنا بالاشتراك في القناة والإعجاب بالفيديو لنشر القرآن الكريم.\n\n#القرآن_الكريم #{sheikh_tag} #{surah_name.replace(' ', '_')} #تلاوة_خاشعة #قرآن"

        print("تم دمج الفيديو. جاري الرفع على يوتيوب باستخدام الكوكيز...")
        
        cookies_raw = os.environ.get("YOUTUBE_COOKIES", "")
        if not cookies_raw:
            print("خطأ: لم يتم العثور على YOUTUBE_COOKIES في الـ Secrets!")
            exit(1)

        parsed_cookies = []
        for line in cookies_raw.splitlines():
            if not line.strip() or line.startswith('#'): continue
            parts = line.strip().split('\t')
            if len(parts) == 7:
                parsed_cookies.append({
                    "domain": parts[0],
                    "path": parts[2],
                    "secure": parts[3] == "TRUE",
                    "expires": int(parts[4]),
                    "name": parts[5],
                    "value": parts[6]
                })

        with sync_playwright() as p:
            browser = p.chromium.launch(headless=True)
            context = browser.new_context()
            context.add_cookies(parsed_cookies)
            page = context.new_page()

            try:
                page.goto("https://youtube.com/upload")
                page.wait_for_timeout(8000)
                
                page.set_input_files("input[type='file']", final_video)
                page.wait_for_timeout(10000)

                page.locator("#textbox").nth(0).fill(video_title)
                page.locator("#textbox").nth(1).fill(video_description)
                
                page.locator("tp-yt-paper-radio-button[name='NOT_MADE_FOR_KIDS']").click()
                page.wait_for_timeout(2000)
                
                for _ in range(3):
                    page.locator("#next-button").click()
                    page.wait_for_timeout(2000)
                
                page.locator("tp-yt-paper-radio-button[name='PUBLIC']").click()
                page.wait_for_timeout(2000)
                
                page.locator("#done-button").click()
                page.wait_for_timeout(15000)
                
                print("تم رفع الفيديو ونشره بنجاح!")
            except Exception as e:
                print(f"حدث خطأ أثناء محاكاة الرفع: {e}")
            finally:
                browser.close()
        EOF
