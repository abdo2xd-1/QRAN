name: Generate Quran Shorts

on:
  workflow_dispatch:
  push:
    paths:
      - '*.mp3'

jobs:
  build-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Arabic Font)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg fonts-hosny-amiri
        cp /usr/share/fonts/opentype/hosny-amiri/Amiri-Bold.ttf ./Amiri-Bold.ttf

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper python-bidi

    - name: Run Video Generation Script
      run: python pipeline.py

    - name: Upload Generated Videos
      uses: actions/upload-artifact@v4
      with:
        name: Final-Videos
        path: video_*.mp4
