jobs:
  build-single-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget curl

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper python-bidi

    - name: Download Arabic Font
      run: wget -O Amiri-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf

    - name: Create and Run Python Script
      env:
        SELECTED_SURAH: ${{ github.event.inputs.surah_name }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import urllib.request
        import json
        import glob
        import random
        import arabic_reshaper
        from bidi.algorithm import get_display
        from PIL import Image, ImageDraw, ImageFont

        font_path = "Amiri-Bold.ttf" 
        full_surah_name = os.environ.get("SELECTED_SURAH", "سورة الكهف")
        target_name = full_surah_name.replace("سورة", "").strip()

        # 1. اختيار صورة خلفية عشوائية من الصور المرفوعة
        available_backgrounds = glob.glob("*.jpg") + glob.glob("*.png")
        available_backgrounds = [img for img in available_backgrounds if img != "Amiri-Bold.ttf"]

        if not available_backgrounds:
            print("خطأ: يرجى رفع صورة خلفية واحدة على الأقل في المستودع!")
            exit(1)

        chosen_background = random.choice(available_backgrounds)
        print(f"تم اختيار الخلفية: {chosen_background}")

        # 2. جلب رقم السورة الصحيح من API موقع mp3quran بالاسم
        api_url = "https://www.mp3quran.net/api/v3/suwar"
        req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
        
        surah_number = None

        try:
            with urllib.request.urlopen(req) as response:
                data = json.loads(response.read().decode('utf-8'))
                for s in data.get('suwar', []):
                    if target_name in s['name']:
                        surah_number = str(s['id']).zfill(3)
                        full_surah_name = s['name']
                        break
        except Exception as e:
            print(f"خطأ في الاتصال بقاعدة بيانات السور: {e}")
            exit(1)

        if not surah_number:
            print(f"لم يتم العثور على سورة '{target_name}' في قاعدة البيانات.")
            exit(1)

        # 3. تحميل الصوت للشيخ المنشاوي
        audio_url = f"https://server10.mp3quran.net/minsh/{surah_number}.mp3"
        local_filename = f"{full_surah_name}.mp3"

        print(f"جاري تحميل {full_surah_name} (رقم {surah_number})...")
        urllib.request.urlretrieve(audio_url, local_filename)

        output_image = f"cover_{surah_number}.jpg"
        final_video = f"video_{surah_number}.mp4"

        # 4. معالجة النص العربي بشكل سليم لمنع انقلاب الحروف
        text_to_write = f"الشيخ محمد صديق المنشاوي\n{full_surah_name}"
        reshaped_text = arabic_reshaper.reshape(text_to_write)
        bidi_text = get_display(reshaped_text)

        # 5. الكتابة على الخلفية المختارة مع ظل أسود للوضوح
        image = Image.open(chosen_background)
        draw = ImageDraw.Draw(image)
        font = ImageFont.truetype(font_path, 80)
        
        draw.multiline_text((image.width/2 + 3, image.height/2 + 3), bidi_text, font=font, fill="black", anchor="mm", align="center")
        draw.multiline_text((image.width/2, image.height/2), bidi_text, font=font, fill="#F5DEB3", anchor="mm", align="center")
        image.save(output_image)

        # 6. دمج الفيديو بأعلى جودة وتأثير شاشة التلفزيون القديمة والشوشرة
        ffmpeg_cmd = [
            "ffmpeg", "-loop", "1", "-i", output_image, "-i", local_filename,
            "-vf", "noise=alls=30:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.5,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
            "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
            "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
        ]
        subprocess.run(ffmpeg_cmd)
        print(f"تم بنجاح إنشاء فيديو: {final_video}")
        EOF

    - name: Upload to Streaming Server & Print Direct Link
      run: |
        echo "جاري رفع الفيديو للحصول على رابط المشاهدة المباشر..."
        VIDEO_FILE=$(ls video_*.mp4 | head -1)
        RESPONSE=$(curl -s -F "file=@$VIDEO_FILE" https://tmpfiles.org/api/v1/upload)
        
        URL=$(echo $RESPONSE | grep -o '"url":"[^"]*"' | head -1 | cut -d'"' -f4)
        DIRECT_URL=$(echo $URL | sed 's|tmpfiles.org/|tmpfiles.org/dl/|')

        echo "===================================================="
        echo " تم رفع الفيديو بنجاح يا عبده!"
        echo " رابط المشاهدة والتشغيل المباشر أونلاين هو:"
        echo " $DIRECT_URL"
        echo "===================================================="
