jobs:
  build-custom-long-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget curl jq

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper python-bidi

    - name: Download Arabic Font
      run: wget -O Amiri-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf

    - name: Create and Run Python Script with Full Custom SEO
      env:
        SELECTED_SHEIKH: ${{ github.event.inputs.sheikh_choice }}
        SELECTED_SURAH: ${{ github.event.inputs.surah_name }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import urllib.request
        import json
        import arabic_reshaper
        from bidi.algorithm import get_display
        from PIL import Image, ImageDraw, ImageFont

        font_path = "Amiri-Bold.ttf" 
        sheikh = os.environ.get("SELECTED_SHEIKH", "المنشاوي")
        full_surah_name = os.environ.get("SELECTED_SURAH", "سورة الكهف")
        target_name = full_surah_name.replace("سورة", "").strip()

        bg_image_path = "base_room_empty.jpg"

        if not os.path.exists(bg_image_path):
            print("خطأ: يرجى رفع صورة الخلفية base_room_empty.jpg في المستودع!")
            exit(1)

        if sheikh == "الدوسري":
            server_folder = "dsri"
            sheikh_name_ar = "الشيخ ياسر بن راشد الدوسري"
            portrait_path = "dosri.png"
        else:
            server_folder = "minsh"
            sheikh_name_ar = "الشيخ محمد صديق المنشاوي"
            portrait_path = "minshawi.png"

        # 1. جلب رقم السورة من API موقع mp3quran
        api_url = "https://www.mp3quran.net/api/v3/suwar"
        req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
        
        surah_number = None
        try:
            with urllib.request.urlopen(req) as response:
                data = json.loads(response.read().decode('utf-8'))
                for s in data.get('suwar', []):
                    if target_name in s['name']:
                        surah_number = str(s['id']).zfill(3)
                        full_surah_name = s['name']
                        break
        except Exception as e:
            print(f"خطأ في الاتصال بقاعدة بيانات السور: {e}")
            exit(1)

        if not surah_number:
            print(f"لم يتم العثور على سورة '{target_name}'.")
            exit(1)

        # 2. تحميل التلاوة كاملة
        audio_url = f"https://server10.mp3quran.net/{server_folder}/{surah_number}.mp3"
        local_filename = f"{full_surah_name}.mp3"
        print(f"جاري تحميل التلاوة الكاملة لـ {full_surah_name}...")
        urllib.request.urlretrieve(audio_url, local_filename)

        image_filename = f"image_{surah_number}.jpg"
        final_video = f"video_{surah_number}.mp4"

        # 3. تصميم الصورة الثابتة
        base_img = Image.open(bg_image_path).convert("RGBA")

        if os.path.exists(portrait_path):
            portrait = Image.open(portrait_path).convert("RGBA")
            portrait = portrait.resize((500, int(portrait.height * (500 / portrait.width))))
            base_img.paste(portrait, (40, base_img.height - portrait.height - 20), portrait)

        draw = ImageDraw.Draw(base_img)
        font_title = ImageFont.truetype(font_path, 110)
        font_sub = ImageFont.truetype(font_path, 45)

        title_text = get_display(arabic_reshaper.reshape(f"{full_surah_name} كاملة"))
        sheikh_text = get_display(arabic_reshaper.reshape(sheikh_name_ar))

        draw.text((703, 103), title_text, font=font_title, fill="black")
        draw.text((700, 100), title_text, font=font_title, fill="#FFD700")

        draw.text((703, 353), sheikh_text, font=font_sub, fill="black")
        draw.text((700, 350), sheikh_text, font=font_sub, fill="#F5DEB3")

        final_image = base_img.convert("RGB")
        final_image.save(image_filename)

        # 4. دمج الفيديو بالكامل مع تأثير التلفزيون القديم
        ffmpeg_cmd = [
            "ffmpeg", "-loop", "1", "-i", image_filename, "-i", local_filename,
            "-vf", "noise=alls=20:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.6,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
            "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
            "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
        ]
        subprocess.run(ffmpeg_cmd)

        # 5. موسوعة العبارات المخصصة لجميع سور القرآن الكريم
