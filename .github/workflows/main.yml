name: Auto Repurposing & Watermark Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *' # يعمل تلقائياً كل 3 ساعات

jobs:
  republish-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & yt-dlp)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install yt-dlp requests google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Run Auto-Download, Watermark & Upload Pipeline
      env:
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import json
        import yt_dlp
        from google.oauth2.credentials import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload

        target_channel = "https://www.youtube.com/@tilawat.quraniat.khalida/videos"
        
        print("=== جاري البحث عن أحدث فيديو في القناة المستهدفة ===")
        
        ydl_opts = {
            'extract_flat': False,
            'max_downloads': 1,
            'format': 'bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]/best',
            'outtmpl': 'downloaded_video.mp4',
        }

        with yt_dlp.YoutubeDL(ydl_opts) as ydl:
            # سحب بيانات أحدث فيديو
            info = ydl.extract_info(target_channel, download=False)
            if 'entries' in info and len(info['entries']) > 0:
                latest_video = info['entries'][0]
                video_url = latest_video.get('webpage_url')
                video_title = latest_video.get('title', 'تلاوة خاشعة مباركة')
                video_desc = latest_video.get('description', 'استمع إلى تلاوة عطرة.') + "\n\n#القرآن_الكريم #تلاوة"
                print(f"تم العثور على أحدث فيديو: {video_title}")
                
                # تحميل الفيديو
                ydl.download([video_url])
            else:
                print("لم يتم العثور على فيديوهات في القناة.")
                exit(1)

        input_file = "downloaded_video.mp4"
        output_file = "watermarked_video.mp4"

        print("=== جاري وضع العلامة المائية على الفيديو باستخدام FFmpeg ===")
        # وضع نص علامة مائية في الزاوية السفلية اليمنى (يمكنك تغيير النص 'اسم قناتك' باللي تحبه)
        watermark_text = "قناتك المباركة"
        
        ffmpeg_cmd = [
            "ffmpeg", "-i", input_file,
            "-vf", f"drawtext=text='{watermark_text}':x=w-tw-20:y=h-th-20:fontsize=24:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5",
            "-codec:a", "copy", "-y", output_file
        ]
        
        subprocess.run(ffmpeg_cmd)

        print("=== جاري الرفع على قناتك على يوتيوب ===")
        client_id = os.environ.get("YOUTUBE_CLIENT_ID")
        client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
        refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

        creds = Credentials(
            None,
            refresh_token=refresh_token,
            token_uri="https://oauth2.googleapis.com/token",
            client_id=client_id,
            client_secret=client_secret
        )

        youtube = build("youtube", "v3", credentials=creds)
        media = MediaFileUpload(output_file, chunksize=1024*1024, resumable=True)
        
        request = youtube.videos().insert(
            part="snippet,status",
            body={
                "snippet": {
                    "categoryId": "22",
                    "title": video_title,
                    "description": video_desc,
                    "tags": ["القرآن_الكريم", "تلاوة_خاشعة"]
                },
                "status": {
                    "privacyStatus": "public"
                }
            },
            media_body=media
        )

        response = None
        while response is None:
            status, response = request.next_chunk()
            if status:
                print(f"تم رفع {int(status.progress() * 100)}% ...")

        print(f"تم بنجاح! تم نشر الفيديو وعليها علامتك المائية. الرابط: https://youtu.be/{response['id']}")
        EOF
