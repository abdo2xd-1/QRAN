name: Generate Quran Shorts

on:
  workflow_dispatch:

jobs:
  build-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper

    - name: Download Arabic Font
      run: wget -O Amiri-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf

    - name: Create and Run Python Script
      run: |
        python3 - << 'EOF'
        import os
        import glob
        import subprocess
        import urllib.request
        import arabic_reshaper
        from PIL import Image, ImageDraw, ImageFont

        font_path = "Amiri-Bold.ttf" 
        base_image = "base_room_empty.jpg"

        if not os.path.exists(base_image):
            print("خطأ: تأكد من رفع صورة الخلفية base_room_empty.jpg في المستودع")
            exit(1)

        # قائمة السور المراد تحميلها
        surahs = {
            "001": "سورة الفاتحة",
            "112": "سورة الإخلاص",
            "113": "سورة الفلق",
            "114": "سورة الناس"
        }
        base_url = "https://server10.mp3quran.net/minsh/"

        for num, name in surahs.items():
            audio_url = f"{base_url}{num}.mp3"
            local_filename = f"{name}.mp3"
            if not os.path.exists(local_filename):
                print(f"جاري تحميل {name}...")
                urllib.request.urlretrieve(audio_url, local_filename)

        audio_files = glob.glob("*.mp3")
        for audio_file in audio_files:
            surah_name = os.path.splitext(audio_file)[0]
            output_image = f"cover_{surah_name}.jpg"
            final_video = f"video_{surah_name}.mp4"
            
            # 1. إصلاح النص العربي بشكل جذري (سطر بسطر وعكسه يدوياً)
            text_lines = ["الشيخ محمد صديق المنشاوي", surah_name]
            final_text = ""
            for line in text_lines:
                reshaped = arabic_reshaper.reshape(line)
                reversed_line = reshaped[::-1] 
                final_text += reversed_line + "\n"

            # 2. الكتابة على الصورة مع ظل أسود لتوضيح القراءة
            image = Image.open(base_image)
            draw = ImageDraw.Draw(image)
            font = ImageFont.truetype(font_path, 80)
            
            draw.multiline_text((image.width/2 + 3, image.height/2 + 3), final_text.strip(), font=font, fill="black", anchor="mm", align="center")
            draw.multiline_text((image.width/2, image.height/2), final_text.strip(), font=font, fill="#F5DEB3", anchor="mm", align="center")
            image.save(output_image)

            # 3. تأثير التلفزيون القديم القوي (حبيبات + خطوط عرضية + ألوان باهتة)
            ffmpeg_cmd = [
                "ffmpeg", "-loop", "1", "-i", output_image, "-i", audio_file,
                "-vf", "noise=alls=30:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.5,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
                "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
                "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
            ]
            subprocess.run(ffmpeg_cmd)
            print(f"تم بنجاح إنشاء فيديو: {final_video}")
        EOF

    - name: Upload Generated Videos
      uses: actions/upload-artifact@v4
      with:
        name: Final-Videos
        path: video_*.mp4
