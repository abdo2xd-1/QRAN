name: Generate All Quran Shorts with Image Choice

on:
  workflow_dispatch:
    inputs:
      background_image:
        description: 'اكتب اسم ملف الصورة التي تريد استخدامها (مثلاً: base_room_empty.jpg)'
        required: true
        default: 'base_room_empty.jpg'
        type: string

jobs:
  build-all-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper

    - name: Download Arabic Font
      run: wget -O Amiri-Bold.ttf https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Bold.ttf

    - name: Create and Run Python Script for All Surahs
      env:
        CHOSEN_BG: ${{ github.event.inputs.background_image }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import urllib.request
        import json
        import arabic_reshaper
        from PIL import Image, ImageDraw, ImageFont

        font_path = "Amiri-Bold.ttf" 
        chosen_background = os.environ.get("CHOSEN_BG", "base_room_empty.jpg")

        if not os.path.exists(chosen_background):
            print(f"خطأ: الصورة المحددة '{chosen_background}' غير موجودة في المستودع! تأكد من كتابة الاسم صحيحاً.")
            exit(1)

        print(f"تم اختيار الخلفية: {chosen_background}")

        # جلب قائمة كل سور القرآن الكريم من API موقع mp3quran الرسمي
        api_url = "https://www.mp3quran.net/api/v3/suwar"
        req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
        
        suwar_list = []
        try:
            with urllib.request.urlopen(req) as response:
                data = json.loads(response.read().decode('utf-8'))
                suwar_list = data.get('suwar', [])
        except Exception as e:
            print(f"خطأ في الاتصال بقاعدة بيانات السور: {e}")
            exit(1)

        print(f"تم العثور على {len(suwar_list)} سورة. جاري بدء الإنتاج الشامل...")

        for s in suwar_list:
            surah_id = str(s['id']).zfill(3)
            surah_name = s['name']
            
            audio_url = f"https://server10.mp3quran.net/minsh/{surah_id}.mp3"
            local_filename = f"{surah_name}.mp3"
            output_image = f"cover_{surah_id}.jpg"
            final_video = f"video_{surah_id}.mp4"

            print(f"\n--- جاري معالجة: {surah_name} (رقم {surah_id}) ---")

            if not os.path.exists(local_filename):
                try:
                    urllib.request.urlretrieve(audio_url, local_filename)
                except Exception as e:
                    print(f"فشل تحميل صوت {surah_name}: {e}")
                    continue

            # تنسيق النص العربي وعكسه يدوياً
            text_lines = ["الشيخ محمد صديق المنشاوي", surah_name]
            final_text = ""
            for line in text_lines:
                reshaped = arabic_reshaper.reshape(line)
                reversed_line = reshaped[::-1] 
                final_text += reversed_line + "\n"

            # رسم النص على الخلفية المختارة مع ظل أسود للوضوح
            image = Image.open(chosen_background)
            draw = ImageDraw.Draw(image)
            font = ImageFont.truetype(font_path, 80)
            
            draw.multiline_text((image.width/2 + 3, image.height/2 + 3), final_text.strip(), font=font, fill="black", anchor="mm", align="center")
            draw.multiline_text((image.width/2, image.height/2), final_text.strip(), font=font, fill="#F5DEB3", anchor="mm", align="center")
            image.save(output_image)

            # دمج الفيديو بأعلى جودة وتأثير شاشة التلفزيون القديمة
            ffmpeg_cmd = [
                "ffmpeg", "-loop", "1", "-i", output_image, "-i", local_filename,
                "-vf", "noise=alls=30:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.5,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
                "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
                "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
            ]
            subprocess.run(ffmpeg_cmd)
            print(f"تم بنجاح إنشاء فيديو: {final_video}")

        print("\nتم الانتهاء من معالجة جميع سور القرآن الكريم بنجاح تام!")
        EOF

    - name: Upload All Generated Videos
      uses: actions/upload-artifact@v4
      with:
        name: All-Quran-Shorts-Videos
        path: video_*.mp4
