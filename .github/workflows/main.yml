name: Generate Quran Shorts

on:
  workflow_dispatch: # زر للتشغيل اليدوي
  push:
    paths:
      - '*.mp3' # يشتغل أوتوماتيك لما ترفع ملف صوت

jobs:
  build-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & Wget)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper python-bidi

    - name: Download Arabic Font
      run: wget -O Amiri-Bold.ttf https://github.com/googlefonts/amiri/raw/main/fonts/ttf/Amiri-Bold.ttf

    - name: Run Video Generation Script
      run: python pipeline.py

    - name: Upload Generated Videos
      uses: actions/upload-artifact@v4
      with:
        name: Final-Videos
        path: video_*.mp4
