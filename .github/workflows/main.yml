            "سورة الفاتحة": "أم الكتاب والشفاء التام لكل داء",
            "سورة البقرة": "سنام القرآن البركة الكبرى وطريدة الشياطين",
            "سورة آل عمران": "الزهراوين الحصن الحصين والثبات عند الفتن",
            "سورة النساء": "أحكام الأسرة والمجتمع والعدالة الإلهية",
            "سورة المائدة": "سورة العهود والميثاق وتمام النعمة",
            "سورة الأنعام": "تقرير توحيد الله وعظمته ودلائل القدرة",
            "سورة الأعراف": "قصص الأنبياء وعبر الأمم السابقة",
            "سورة الأنفال": "دروس النصر والتوكل وجهاد النفس",
            "سورة التوبة": "البراءة وفضح المنافقين والرحمة الواسعة",
            "سورة يونس": "اليقين المطلق وتدبير الله الخفي",
            "سورة هود": "الثبات على الحق مهما كثرت الصعاب",
            "سورة يوسف": "أحسن القصص صبر جميل وفرج قريب",
            "سورة الرعد": "عظمة الخالق وتسبيح الرعد بحمده",
            "سورة إبراهيم": "بيان نعم الله التي لا تحصى والتوحيد الخالص",
            "سورة الحجر": "حفظ القرآن الكريم ومعجزاته الخالدة",
            "سورة النحل": "سورة النعم الكبرى والامتنان للخالق",
            "سورة الإسراء": "رحلة الإسراء والمعراج ومعجزات القدرة",
            "سورة الكهف": "راحة للقلوب ونور ما بين الجمعتين",
            "سورة مريم": "نفحات الرحمة وقصة زكريا ومريم العذراء",
            "سورة طه": "تثقيب القلوب بذكر الله والسكينة",
            "سورة الأنبياء": "استجابة الدعاء وسر دعاء ذي النون",
            "سورة الحج": "مناسك الإيمان ونداء التوحيد الخالد",
            "سورة المؤمنون": "صفات عباد الرحمن الفلاح الحقيقي",
            "سورة النور": "نور السموات والأرض والآداب العظيمة",
            "سورة الفرقان": "صفات عباد الرحمن وراحتهم النفسية",
