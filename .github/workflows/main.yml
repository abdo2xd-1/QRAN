        DIRECT_URL=$(echo $RESPONSE | jq -r '.link // empty')

        echo "===================================================="
        if [ -n "$DIRECT_URL" ]; then
          echo " تم رفع الفيديو بنجاح يا عبده!"
          echo " رابط التحميل والمشاهدة المباشر هو:"
          echo " $DIRECT_URL"
        else
          echo " حدث خطأ أثناء استخراج الرابط، الاستجابة كانت:"
          echo "$RESPONSE"
        fi
        echo "===================================================="
        echo " العنوان والوصف المخصص لهذه السورة:"
        cat seo_metadata.txt
        echo "===================================================="
