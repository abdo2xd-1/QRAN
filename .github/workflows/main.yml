jobs:
  build-and-publish-long-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg wget

    - name: Install Python Dependencies
      run: |
        pip install google-api-python-client google-auth-oauthlib google-auth-httplib2 requests

    - name: AI Planning, Video Processing and YouTube Upload
      env:
        GITHUB_EVENT_NAME: ${{ github.event_name }}
        SELECTED_SHEIKH: ${{ github.event.inputs.sheikh_choice }}
        SELECTED_SURAH: ${{ github.event.inputs.surah_name }}
        OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import urllib.request
        import json
        import random
        import requests
        from datetime import datetime, timezone, timedelta
        from google.oauth2.credentials import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload

        event_name = os.environ.get("GITHUB_EVENT_NAME", "schedule")
        openrouter_key = os.environ.get("OPENROUTER_API_KEY")

        # 1. جلب بيانات السور برابط سليم بدون أخطاء
        api_url = "https://www.mp3quran.net/api/v3/suwar"
        req = urllib.request.Request(api_url, headers={'User-Agent': 'Mozilla/5.0'})
        suwar_list = []
        try:
            with urllib.request.urlopen(req) as response:
                data = json.loads(response.read().decode('utf-8'))
                suwar_list = data.get('suwar', [])
        except Exception as e:
            print(f"خطأ في جلب البيانات: {e}")
            exit(1)

        # 2. تحديد المعطيات واستشارة الذكاء الاصطناعي
        print("جاري التواصل مع الذكاء الاصطناعي لتجهيز بيانات الفيديو...")
        
        if event_name == "workflow_dispatch":
            sheikh_input = os.environ.get("SELECTED_SHEIKH", "المنشاوي")
            surah_input = os.environ.get("SELECTED_SURAH", "سورة الكهف")
            target_name_search = surah_input.replace("سورة", "").strip()
            
            target_surah_id = "018"
            for s in suwar_list:
                if target_name_search in s['name']:
                    target_surah_id = str(s['id']).zfill(3)
                    break
                    
            prompt = f"""
            أنت مدير قناة يوتيوب إسلامية. سأقوم برفع فيديو لـ {surah_input} بصوت القارئ {sheikh_input}.
            مطلوب منك:
            1. كتابة عنوان جذاب ومؤثر جداً لهذا الفيديو.
            2. كتابة وصف طويل ومريح للقلب يحتوي على دعاء.
            3. كتابة 5 كلمات مفتاحية (Tags).
            
            أريد الرد بصيغة JSON فقط كالتالي بدون أي نصوص إضافية:
            {{
                "title": "عنوان الفيديو هنا",
                "description": "الوصف هنا",
                "tags": ["tag1", "tag2"]
            }}
            """
        else:
            prompt = """
            أنت مدير قناة يوتيوب إسلامية. ستقوم بجدولة فيديو جديد.
            مطلوب منك:
            1. اختر عشوائياً بين "المنشاوي" أو "الدوسري".
            2. اختر رقم سورة عشوائي من 1 إلى 114.
            3. اكتب عنوان فيديو جذاب ومؤثر جداً.
            4. اكتب وصفاً طويلاً للفيديو يحتوي على دعاء.
            5. اكتب 5 كلمات مفتاحية (Tags).
            
            أريد الرد بصيغة JSON فقط كالتالي بدون أي نصوص إضافية:
            {{
                "sheikh": "المنشاوي",
                "surah_id": "018",
                "title": "عنوان الفيديو",
                "description": "وصف الفيديو",
                "tags": ["tag1", "tag2"]
            }}
            """

        headers = {
            "Authorization": f"Bearer {openrouter_key}",
            "Content-Type": "application/json"
        }
        payload = {
            "model": "google/gemini-2.5-flash",
            "messages": [{"role": "user", "content": prompt}],
            "response_format": {"type": "json_object"}
        }

        ai_plan = {}
        try:
            ai_response = requests.post("https://openrouter.ai/api/v1/chat/completions", headers=headers, json=payload).json()
            ai_plan = json.loads(ai_response['choices'][0]['message']['content'])
            print("تم استلام خطة الذكاء الاصطناعي بنجاح.")
        except Exception as e:
            print(f"حدث خطأ في جلب بيانات الذكاء الاصطناعي ({e})، سيتم استخدام الافتراضي.")
            ai_plan = {
                "title": "تلاوة خاشعة تريح القلب",
                "description": "استمع بقلبك إلى هذه التلاوة المباركة.",
                "tags": ["القرآن_الكريم", "تلاوة_خاشعة", "قرآن"]
            }

        # 3. تحديد السورة والشيخ النهائيين
        if event_name == "workflow_dispatch":
            final_sheikh = sheikh_input
            final_surah_id = target_surah_id
        else:
            final_sheikh = ai_plan.get("sheikh", "المنشاوي")
            final_surah_id = str(ai_plan.get("surah_id", "018")).zfill(3)

        server_folder = "dsri" if final_sheikh == "الدوسري" else "minsh"
        surah_name = ""
        for s in suwar_list:
            if str(s['id']).zfill(3) == final_surah_id:
                surah_name = f"سورة {s['name']}"
                break

        # 4. تحميل التلاوة
        audio_url = f"https://server10.mp3quran.net/{server_folder}/{final_surah_id}.mp3"
        local_filename = f"{surah_name}.mp3"
        print(f"جاري تحميل التلاوة لـ {surah_name} بصوت {final_sheikh}...")
        urllib.request.urlretrieve(audio_url, local_filename)

        image_filename = "base_room_empty.jpg"
        if not os.path.exists(image_filename):
            print("خطأ: الصورة base_room_empty.jpg غير موجودة!")
            exit(1)

        final_video = f"video_{final_surah_id}.mp4"

        # 5. الدمج باستخدام FFmpeg
        print("جاري دمج الفيديو والصوت...")
        ffmpeg_cmd = [
            "ffmpeg", "-loop", "1", "-i", image_filename, "-i", local_filename,
            "-vf", "noise=alls=20:allf=t+u,eq=contrast=1.1:brightness=-0.05:saturation=0.6,drawgrid=width=iw:height=6:thickness=2:color=black@0.3",
            "-c:v", "libx264", "-tune", "stillimage", "-c:a", "aac", "-b:a", "192k",
            "-pix_fmt", "yuv420p", "-shortest", "-y", final_video
        ]
        subprocess.run(ffmpeg_cmd)

        # 6. الرفع المباشر باستخدام YouTube API
        print("جاري الرفع على يوتيوب بالبيانات التي كتبها الذكاء الاصطناعي...")
        client_id = os.environ.get("YOUTUBE_CLIENT_ID")
        client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
        refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

        if not all([client_id, client_secret, refresh_token]):
            print("خطأ: مفاتيح يوتيوب غير مكتملة في الـ Secrets!")
            exit(1)

        creds = Credentials(
            None,
            refresh_token=refresh_token,
            token_uri="https://oauth2.googleapis.com/token",
            client_id=client_id,
            client_secret=client_secret
        )

        youtube = build("youtube", "v3", credentials=creds)
        media = MediaFileUpload(final_video, chunksize=1024*1024, resumable=True)
        
        request = youtube.videos().insert(
            part="snippet,status",
            body={
                "snippet": {
                    "categoryId": "22",
                    "title": ai_plan.get("title", f"{surah_name} | {final_sheikh}"),
                    "description": ai_plan.get("description", "تلاوة خاشعة"),
                    "tags": ai_plan.get("tags", ["القرآن_الكريم"])
                },
                "status": {
                    "privacyStatus": "public"
                }
            },
            media_body=media
        )

        response = None
        while response is None:
            status, response = request.next_chunk()
            if status:
                print(f"تم رفع {int(status.progress() * 100)}% ...")

        print(f"تم الرفع بنجاح! رابط الفيديو: https://youtu.be/{response['id']}")
        EOF
