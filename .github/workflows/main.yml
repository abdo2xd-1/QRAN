name: Auto Repurposing Long Videos & Watermark Pipeline

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */3 * * *'

jobs:
  republish-video:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg & yt-dlp)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg
        pip install yt-dlp google-api-python-client google-auth-oauthlib google-auth-httplib2

    - name: Run Auto-Download, Watermark & Upload Pipeline
      env:
        YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
        YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
      run: |
        python3 - << 'EOF'
        import os
        import subprocess
        import yt_dlp
        from google.oauth2.credentials import Credentials
        from googleapiclient.discovery import build
        from googleapiclient.http import MediaFileUpload

        print("=== تجهيز ملف الكوكيز لتخطي حظر يوتيوب ===")
        cookies_data = os.environ.get("YOUTUBE_COOKIES", "")
        if not cookies_data:
            print("تحذير: لم يتم العثور على YOUTUBE_COOKIES في إعدادات Secrets!")
        else:
            with open("cookies.txt", "w") as f:
                f.write(cookies_data)

        # استهداف قسم الفيديوهات الطويلة
        target_channel = "https://www.youtube.com/@tilawat.quraniat.khalida/videos"
        print("=== جاري البحث عن أحدث فيديو في القناة المستهدفة ===")
        
        ydl_opts = {
            'extract_flat': False,
            'max_downloads': 1,
            'format': 'b',  # تحميل أفضل صيغة مدمجة جاهزة
            'outtmpl': 'downloaded_video.mp4',
            'cookiefile': 'cookies.txt' if os.path.exists('cookies.txt') else None,
            # السطر السحري لتخطي حظر السيرفرات وإيهام يوتيوب أن الطلب من هاتف أندرويد
            'extractor_args': {'youtube': ['player_client=android']},
        }

        video_title = "تلاوة قرآنية مباركة"
        video_desc = "تلاوة خاشعة تريح القلوب"

        with yt_dlp.YoutubeDL(ydl_opts) as ydl:
            info = ydl.extract_info(target_channel, download=False)
            if 'entries' in info and len(info['entries']) > 0:
                latest_video = info['entries'][0]
                video_url = latest_video.get('webpage_url')
                video_title = latest_video.get('title', video_title)
                video_desc = latest_video.get('description', video_desc)
                print(f"تم العثور على الفيديو: {video_title}")
                ydl.download([video_url])
            else:
                print("لم يتم العثور على فيديوهات.")
                exit(1)

        input_file = "downloaded_video.mp4"
        output_file = "watermarked_video.mp4"

        print("=== جاري وضع العلامة المائية على الفيديو الطويل بالكامل ===")
        watermark_text = "قناتك المباركة"
        
        # إضافة العلامة المائية بدون أي اقتطاع للوقت (الفيديو بالكامل)
        ffmpeg_cmd = [
            "ffmpeg", "-i", input_file,
            "-vf", f"drawtext=text='{watermark_text}':x=w-tw-20:y=h-th-20:fontsize=36:fontcolor=white:box=1:boxcolor=black@0.5:boxborderw=5",
            "-codec:a", "copy", "-y", output_file
        ]
        subprocess.run(ffmpeg_cmd)

        print("=== جاري الرفع على يوتيوب ===")
        client_id = os.environ.get("YOUTUBE_CLIENT_ID")
        client_secret = os.environ.get("YOUTUBE_CLIENT_SECRET")
        refresh_token = os.environ.get("YOUTUBE_REFRESH_TOKEN")

        if not all([client_id, client_secret, refresh_token]):
            print("خطأ: مفاتيح يوتيوب غير مكتملة في Secrets!")
            exit(1)

        creds = Credentials(
            None,
            refresh_token=refresh_token,
            token_uri="https://oauth2.googleapis.com/token",
            client_id=client_id,
            client_secret=client_secret
        )

        youtube = build("youtube", "v3", credentials=creds)
        media = MediaFileUpload(output_file, chunksize=1024*1024, resumable=True)
        
        request = youtube.videos().insert(
            part="snippet,status",
            body={
                "snippet": {
                    "categoryId": "22",
                    "title": video_title,
                    "description": video_desc + "\n\n#القرآن_الكريم #تلاوة_خاشعة",
                    "tags": ["القرآن_الكريم", "تلاوة_خاشعة", "قرآن"]
                },
                "status": {
                    "privacyStatus": "public"
                }
            },
            media_body=media
        )

        response = None
        while response is None:
            status, response = request.next_chunk()
            if status:
                print(f"تم رفع {int(status.progress() * 100)}% ...")

        print(f"تم بنجاح! الرابط: https://youtu.be/{response['id']}")
        EOF
