name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Upload Video and Assets to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Quran-Video-Output
          path: |
            output.mp4
            thumbnail_final.jpg
            title.txt
            desc.txt
          retention-days: 7
