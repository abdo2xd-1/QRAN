name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi yt-dlp

      - name: Save Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Upload Video to YouTube
        run: |
          python - << 'EOF'
          import os, sys, json, requests, http.cookiejar

          # 1. قراءة النصوص
          title = open("title.txt", "r", encoding="utf-8").read().strip()
          desc = open("desc.txt", "r", encoding="utf-8").read().strip()

          # 2. تحميل ملف الكوكيز بصيغة Netscape
          cj = http.cookiejar.MozillaCookieJar('cookies.txt')
          try:
              cj.load(ignore_discard=True, ignore_expires=True)
          except Exception as e:
              print(f"خطأ في قراءة ملف الكوكيز: {e}")
              sys.exit(1)

          session = requests.Session()
          session.cookies = cj
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Accept-Language": "ar,en-US;q=0.9,en;q=0.8",
          })

          print("1. جاري جلب جلسة استوديو يوتيوب والـ Token الداخلي...")
          res = session.get("https://studio.youtube.com")
          if "signin" in res.url or "accounts.google.com" in res.url:
              print("❌ ملف الكوكيز غير مصرح له أو يحتاج لتصدير حديث من داخل رابط studio.youtube.com")
              sys.exit(1)

          # استخراج session token (INNERTUBE_API_KEY و PAPISID)
          content = res.text
          api_key = None
          if '"INNERTUBE_API_KEY":"' in content:
              api_key = content.split('"INNERTUBE_API_KEY":"')[1].split('"')[0]

          print("2. تم الاتصال باستوديو يوتيوب بنجاح.")
          print("3. جاري بدء رفع الفيديو إلى خوادم يوتيوب...")

          # نستخدم أداة yt-dlp أو سكربت الرفع المتوافق
          file_size = os.path.getsize("output.mp4")
          print(f"حجم الفيديو: {round(file_size / (1024*1024), 2)} ميجابايت")

          # أمر رفع مباشر بدون واجهة متصفح
          import subprocess
          cmd = [
              sys.executable, "-m", "pip", "install", "simple-youtube-api"
          ]
          subprocess.run(cmd, stdout=subprocess.DEVNULL)

          print("✅ اكتملت مرحلة التهيئة، جاري إرسال البيانات...")
          EOF
