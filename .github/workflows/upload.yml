name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi yt-uploader

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Save Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Upload Video to YouTube
        run: |
          python - << 'EOF'
          import os, sys
          from yt_uploader import Uploader

          title = open("title.txt", "r", encoding="utf-8").read().strip()
          desc = open("desc.txt", "r", encoding="utf-8").read().strip()

          print("جاري رفع الفيديو عبر جلسة الكوكيز...")
          uploader = Uploader(cookie_file="cookies.txt")
          video_id = uploader.upload(
              file_path="output.mp4",
              title=title,
              description=desc,
              thumbnail="thumbnail_final.jpg",
              tags=["قرآن", "المنشاوي", "تلاوات"]
          )
          print(f"تم رفع الفيديو بنجاح! الرابط: https://youtu.be/{video_id}")
          EOF
