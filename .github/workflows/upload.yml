name: Generate Quran Shorts

on:
  workflow_dispatch: # يتيح لك تشغيل الكود يدوياً بزر "Run workflow"
  push:
    paths:
      - '*.mp3' # يعمل تلقائياً عند رفع أي ملف صوتي جديد

jobs:
  build-videos:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install System Dependencies (FFmpeg)
      run: |
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Install Python Dependencies
      run: |
        pip install Pillow arabic-reshaper python-bidi

    - name: Run Video Generation Script
      run: python main.py

    - name: Upload Generated Videos
      uses: actions/upload-artifact@v4
      with:
        name: Final-Videos
        path: video_*.mp4
