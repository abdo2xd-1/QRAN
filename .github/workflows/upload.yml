name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi google-api-python-client google-auth-httplib2 google-auth-oauthlib

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Upload Video to YouTube via Official API
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          python - << 'EOF'
          import os, sys
          from google.oauth2.credentials import Credentials
          from google.auth.transport.requests import Request
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          c_id = os.environ.get("CLIENT_ID", "").strip()
          c_sec = os.environ.get("CLIENT_SECRET", "").strip()
          r_token = os.environ.get("REFRESH_TOKEN", "").strip()

          title = open("title.txt", "r", encoding="utf-8").read().strip()
          desc = open("desc.txt", "r", encoding="utf-8").read().strip()

          creds = Credentials(
              token=None,
              refresh_token=r_token,
              token_uri="https://oauth2.googleapis.com/token",
              client_id=c_id,
              client_secret=c_sec
          )

          print("1. جاري التحقق من صلاحية التوكن وتجديده...")
          creds.refresh(Request())

          youtube = build("youtube", "v3", credentials=creds)

          print("2. جاري بدء رفع الفيديو عبر YouTube Data API الرسمي...")
          body = {
              "snippet": {
                  "title": title,
                  "description": desc,
                  "tags": ["القرآن الكريم", "المنشاوي", "تلاوات خاشعة", "تلاوة هادئة"],
                  "categoryId": "22"
              },
              "status": {
                  "privacyStatus": "public",
                  "selfDeclaredMadeForKids": False
              }
          }

          media = MediaFileUpload("output.mp4", chunksize=10*1024*1024, resumable=True)
          request = youtube.videos().insert(part="snippet,status", body=body, media_body=media)

          response = None
          while response is None:
              status, response = request.next_chunk()
              if status:
                  print(f"تم رفع: {int(status.progress() * 100)}%")

          video_id = response.get("id")
          print(f"✅ تم رفع الفيديو بنجاح! الرابط: https://youtu.be/{video_id}")

          if os.path.exists("thumbnail_final.jpg"):
              print("3. جاري تعيين الصورة المصغرة...")
              try:
                  youtube.thumbnails().set(
                      videoId=video_id,
                      media_body=MediaFileUpload("thumbnail_final.jpg")
                  ).execute()
                  print("✅ تم تعيين الصورة المصغرة بنجاح!")
              except Exception as e:
                  print(f"تنبيه بخصوص الصورة المصغرة: {e}")
          EOF
