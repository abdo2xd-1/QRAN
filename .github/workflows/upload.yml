name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi yt-dlp

      - name: Save Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Upload Video to YouTube
        run: |
          python - << 'EOF'
          import os, sys, time, json, requests, http.cookiejar, hashlib

          title = open("title.txt", "r", encoding="utf-8").read().strip()
          desc = open("desc.txt", "r", encoding="utf-8").read().strip()

          cj = http.cookiejar.MozillaCookieJar('cookies.txt')
          try:
              cj.load(ignore_discard=True, ignore_expires=True)
          except Exception as e:
              print(f"خطأ في قراءة ملف الكوكيز: {e}")
              sys.exit(1)

          session = requests.Session()
          session.cookies = cj

          # جلب قيمة SAPISID لتوليد توثيق SAPISIDHASH
          sapisid = None
          for c in cj:
              if c.name in ["SAPISID", "__Secure-3PAPISID"]:
                  sapisid = c.value
                  break

          if not sapisid:
              print("❌ ملف الكوكيز لا يحتوي على SAPISID. تأكد من نسخه كاملاً.")
              sys.exit(1)

          curr_time = str(int(time.time()))
          origin = "https://www.youtube.com"
          hash_input = f"{curr_time} {sapisid} {origin}"
          sha1_hash = hashlib.sha1(hash_input.encode("utf-8")).hexdigest()
          auth_header = f"SAPISIDHASH {curr_time}_{sha1_hash}"

          session.headers.update({
              "Authorization": auth_header,
              "X-Origin": origin,
              "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36",
              "Content-Type": "application/json"
          })

          print("1. جاري بدء طلب رفع الفيديو عبر Resumable Upload API...")
          file_size = os.path.getsize("output.mp4")

          init_url = "https://upload.youtube.com/upload/studio"
          headers_init = {
              "X-Goog-Upload-Command": "start",
              "X-Goog-Upload-Header-Content-Length": str(file_size),
              "X-Goog-Upload-Protocol": "resumable"
          }

          res = session.post(init_url, headers=headers_init)
          upload_url = res.headers.get("X-Goog-Upload-URL")

          if not upload_url:
              print("فشل الحصول على رابط الرفع المباشر. الرد:", res.status_code, res.text[:200])
              sys.exit(1)

          print("2. تم تجهيز رابط النقل. جاري رفع ملف الفيديو...")
          with open("output.mp4", "rb") as f:
              upload_headers = {
                  "X-Goog-Upload-Command": "upload, finalize",
                  "X-Goog-Upload-Offset": "0"
              }
              upload_res = session.post(upload_url, headers=upload_headers, data=f)

          video_info = upload_res.json()
          encrypted_id = video_info.get("encryptedVideoId")

          if not encrypted_id:
              print("فشل معالجة الفيديو في يوتيوب:", video_info)
              sys.exit(1)

          print(f"3. تم استقبال الفيديو! معرف الفيديو: {encrypted_id}")

          # حفظ التعديلات للعنوان والوصف
          meta_url = "https://studio.youtube.com/youtubei/v1/video_manager/metadata_update"
          meta_payload = {
              "encryptedVideoId": encrypted_id,
              "title": {"newTitle": title},
              "description": {"newDescription": desc},
              "privacy": {"newPrivacy": "PUBLIC"}
          }
          session.post(meta_url, json=meta_payload)

          print(f"✅ تم الرفع والنشر بنجاح! الرابط: https://youtu.be/{encrypted_id}")
          EOF
