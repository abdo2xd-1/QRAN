name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Install Rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone

      - name: Upload Video to Google Drive via Rclone
        env:
          CONF_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          # كتابة الإعدادات في ملف صريح والتأكد من وجود البيانات
          echo "$CONF_DATA" > /tmp/rclone.conf
          
          echo "جاري رفع الفيديو إلى مجلد Quran_Videos في Google Drive..."
          rclone --config /tmp/rclone.conf copy output.mp4 gdrive:Quran_Videos/ --progress -v
          
          if [ -f "thumbnail_final.jpg" ]; then
            rclone --config /tmp/rclone.conf copy thumbnail_final.jpg gdrive:Quran_Videos/ --progress
          fi
          if [ -f "title.txt" ]; then
            rclone --config /tmp/rclone.conf copy title.txt gdrive:Quran_Videos/
            rclone --config /tmp/rclone.conf copy desc.txt gdrive:Quran_Videos/
          fi
          
          echo "✅ تم رفع الملفات بالكامل إلى مجلد Quran_Videos في Google Drive بنجاح!"
