name: Quran Video Auto Publisher

on:
  workflow_dispatch:
    inputs:
      surah_number:
        description: 'اكتب رقم السورة (1 إلى 114) — مثال: 18 للكهف، 20 لطه'
        required: true
        default: '18'

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python Dependencies
        run: |
          pip install requests Pillow arabic-reshaper python-bidi yt-dlp playwright
          playwright install --with-deps chromium

      - name: Save Cookies File
        env:
          COOKIES_DATA: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          echo "$COOKIES_DATA" > cookies.txt

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Generate Quran Video
        env:
          SURAH_NUMBER: ${{ github.event.inputs.surah_number }}
        run: python pipeline.py

      - name: Upload Video to YouTube
        run: |
          python - << 'EOF'
          import os, sys, time
          from playwright.sync_api import sync_playwright

          title = open("title.txt", "r", encoding="utf-8").read().strip()
          desc = open("desc.txt", "r", encoding="utf-8").read().strip()

          # تحويل cookies.txt إلى صيغة تدعم متصفح Playwright
          cookies = []
          with open("cookies.txt", "r", encoding="utf-8", errors="ignore") as f:
              for line in f:
                  if line.startswith("#") or not line.strip():
                      continue
                  parts = line.strip().split("\t")
                  if len(parts) >= 7:
                      cookie_dict = {
                          "name": parts[5],
                          "value": parts[6],
                          "domain": parts[0] if parts[0].startswith(".") else "." + parts[0],
                          "path": parts[2],
                          "secure": parts[3].lower() == "true"
                      }
                      cookies.append(cookie_dict)

          print(f"تم تحميل {len(cookies)} قيمة تعريفية من ملف الكوكيز.")

          user_agent = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0.0.0 Safari/537.36"

          with sync_playwright() as p:
              browser = p.chromium.launch(
                  headless=True,
                  args=[
                      "--disable-blink-features=AutomationControlled",
                      "--no-sandbox",
                      "--disable-setuid-sandbox"
                  ]
              )
              context = browser.new_context(
                  user_agent=user_agent,
                  viewport={"width": 1920, "height": 1080},
                  locale="ar-EG"
              )
              context.add_cookies(cookies)

              page = context.new_page()
              print("جاري فتح استوديو YouTube مباشرة...")
              page.goto("https://studio.youtube.com", timeout=90000, wait_until="domcontentloaded")
              time.sleep(5)

              print(f"الرابط الحالي للمتصفح: {page.url}")

              if "accounts.google.com" in page.url:
                  # إذا طلبت جوجل تأكيد، نلتقط صورة للتشخيص
                  page.screenshot(path="auth_failed.png")
                  print("❌ رفض خادم Google جلسة الاستوديو التلقائية وطلب تسجيل دخول جديد.")
                  sys.exit(1)

              print("تم الدخول إلى استوديو YouTube بنجاح! جاري رفع ملف الفيديو...")

              # الضغط على زر إنشاء / رفع
              upload_btn = page.locator("#create-icon, #upload-icon, button:has-text('Create'), button:has-text('إنشاء')").first
              upload_btn.wait_for(state="visible", timeout=30000)
              upload_btn.click()
              time.sleep(2)

              # اختيار رفع فيديو
              upload_choice = page.locator("tp-yt-paper-item:has-text('Upload videos'), tp-yt-paper-item:has-text('تحميل فيديوهات')").first
              if upload_choice.is_visible():
                  upload_choice.click()
                  time.sleep(2)

              # تحديد ملف الفيديو
              with page.expect_file_chooser() as fc_info:
                  file_btn = page.locator("#select-files-button, input[type='file']").first
                  file_btn.click()
              file_chooser = fc_info.value
              file_chooser.set_files("output.mp4")

              print("تم اختيار ملف الفيديو بنجاح، جاري الانتظار حتى اكتمال تحميل عناصر الاستمارة...")
              time.sleep(10)

              # خيار ليس مخصصاً للأطفال
              not_for_kids = page.locator("tp-yt-paper-radio-button[name='NOT_MADE_FOR_KIDS']").first
              if not_for_kids.is_visible():
                  not_for_kids.click()

              # الضغط على التالي حتى صفحة النشر
              for i in range(3):
                  nxt = page.locator("#next-button").first
                  if nxt.is_visible():
                      nxt.click()
                      time.sleep(3)

              # اختيار علني (Public)
              pub_radio = page.locator("tp-yt-paper-radio-button[name='PUBLIC']").first
              if pub_radio.is_visible():
                  pub_radio.click()

              # زر الحفظ النهائي
              done_btn = page.locator("#done-button").first
              if done_btn.is_visible():
                  done_btn.click()
                  time.sleep(7)

              print("✅ تم إرسال ونشر الفيديو بنجاح على قناتك!")
              browser.close()
          EOF
