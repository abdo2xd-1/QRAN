name: Get Lifetime YouTube Token

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Authenticate with Google
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python - << 'EOF'
          import os, time, sys, requests

          c_id = os.environ.get("CLIENT_ID", "").strip()
          c_sec = os.environ.get("CLIENT_SECRET", "").strip()

          if not c_id or not c_sec:
              print("خطأ: تأكد من وجود CLIENT_ID و CLIENT_SECRET في Secrets!")
              sys.exit(1)

          # 1. طلب الكود لجهاز التلفاز
          req = requests.post("https://oauth2.googleapis.com/device/code", data={
              "client_id": c_id,
              "scope": "https://www.googleapis.com/auth/youtube.upload"
          }).json()

          if "device_code" not in req:
              print("خطأ في الاتصال بجوجل:", req)
              sys.exit(1)

          d_code = req["device_code"]
          u_code = req["user_code"]
          url = req.get("verification_url", "https://www.google.com/device")
          interval = req.get("interval", 5)

          print("\n" + "="*60)
          print(f"1. افتح هذا الرابط فوراً: {url}")
          print(f"2. ادخل هذا الكود: {u_code}")
          print("="*60 + "\n")
          sys.stdout.flush()

          # 2. الانتظار حتى تقوم بإدخال الكود في المتصفح
          while True:
              time.sleep(interval)
              res = requests.post("https://oauth2.googleapis.com/token", data={
                  "client_id": c_id,
                  "client_secret": c_sec,
                  "device_code": d_code,
                  "grant_type": "urn:ietf:params:oauth:grant-type:device_code"
              }).json()

              if "refresh_token" in res:
                  print("\n" + "#"*60)
                  print("تم استخراج التوكن الدائم بنجاح:")
                  print(res["refresh_token"])
                  print("#"*60 + "\n")
                  break
              
              err = res.get("error")
              if err == "authorization_pending":
                  print("... بانتظار إدخال الكود والموافقة في صفحة جوجل")
                  sys.stdout.flush()
              elif err == "slow_down":
                  time.sleep(interval + 5)
              else:
                  print("... جاري الانتظار لحين إدخال الكود في المتصفح")
                  sys.stdout.flush()
          EOF
