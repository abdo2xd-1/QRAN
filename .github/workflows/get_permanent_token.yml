name: Get Lifetime YouTube Token

on:
  workflow_dispatch:

jobs:
  get-token:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Authenticate with Google
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python - << 'EOF'
          import os, time, sys, requests

          c_id = os.environ.get("CLIENT_ID", "").strip()
          c_sec = os.environ.get("CLIENT_SECRET", "").strip()

          print(f"طول Client ID: {len(c_id)}")
          print(f"طول Client Secret: {len(c_sec)}")

          # 1. طلب كود الجهاز
          device_res = requests.post("https://oauth2.googleapis.com/device/code", data={
              "client_id": c_id,
              "scope": "https://www.googleapis.com/auth/youtube.upload"
          }).json()

          if "device_code" not in device_res:
              print("خطأ في الاتصال بجوجل:", device_res)
              sys.exit(1)

          d_code = device_res["device_code"]
          u_code = device_res["user_code"]
          url = device_res.get("verification_url", "https://www.google.com/device")
          interval = device_res.get("interval", 5)

          print("\n" + "="*60)
          print(f"1. افتح هذا الرابط: {url}")
          print(f"2. اكتب هذا الكود: {u_code}")
          print("="*60 + "\n")
          sys.stdout.flush()

          # 2. حلقة الانتظار لحين إدخال الكود والموافقة
          while True:
              time.sleep(interval)
              token_data = {
                  "client_id": c_id,
                  "client_secret": c_sec,
                  "code": d_code,
                  "grant_type": "http://oauth.net/grant_type/device/1.0"
              }
              res = requests.post("https://oauth2.googleapis.com/token", data=token_data).json()

              if "refresh_token" in res:
                  print("\n" + "#"*60)
                  print("تم استخراج التوكن الدائم بنجاح:")
                  print(res["refresh_token"])
                  print("#"*60 + "\n")
                  break
              
              err = res.get("error")
              if err == "authorization_pending":
                  print("... بانتظار إدخال الكود والموافقة في المتصفح")
                  sys.stdout.flush()
              elif err == "slow_down":
                  time.sleep(interval + 2)
              else:
                  print("خطأ من جوجل:", res)
                  sys.exit(1)
          EOF
