name: Get YouTube Token

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Authorize Device
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python -c '
          import os, time, requests

          client_id = os.environ["CLIENT_ID"].strip()
          client_secret = os.environ["CLIENT_SECRET"].strip()

          # 1. طلب كود المصادقة للجهاز
          init_data = {
              "client_id": client_id,
              "scope": "https://www.googleapis.com/auth/youtube.upload"
          }
          
          res = requests.post("https://oauth2.googleapis.com/device/code", data=init_data).json()

          if "error" in res:
              print("Init Error:", res)
              exit(1)

          device_code = res["device_code"]
          user_code = res["user_code"]
          verification_url = res.get("verification_url", "https://www.google.com/device")
          interval = res.get("interval", 5)

          print("\n" + "="*50)
          print(f"1. افتح هذا الرابط: {verification_url}")
          print(f"2. ادخل هذا الكود: {user_code}")
          print("="*50 + "\n")
          print("بانتظار موافقتك عبر المتصفح...")

          # 2. حلقة استلام التوكن
          token_payload = {
              "client_id": client_id,
              "device_code": device_code,
              "grant_type": "urn:ietf:params:oauth:grant-type:device_code"
          }
          if client_secret:
              token_payload["client_secret"] = client_secret

          while True:
              time.sleep(interval)
              token_res = requests.post("https://oauth2.googleapis.com/token", data=token_payload).json()

              if "refresh_token" in token_res:
                  print("\nتم استخراج التوكن بنجاح!")
                  print("="*50)
                  print(token_res["refresh_token"])
                  print("="*50)
                  break
              
              err = token_res.get("error")
              if err == "authorization_pending":
                  continue
              elif err == "slow_down":
                  time.sleep(interval)
                  continue
              else:
                  # محاولة ثانية بدون إرسال client_secret إذا رفض السيرفر
                  if "client_secret" in token_payload:
                      del token_payload["client_secret"]
                      continue
                  print("Token Error:", token_res)
                  break
          '
