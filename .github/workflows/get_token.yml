name: Get YouTube Token

on:
  workflow_dispatch:

jobs:
  auth:
    runs-on: ubuntu-latest
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Requests
        run: pip install requests

      - name: Authorize Device
        env:
          CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
        run: |
          python -c '
          import os, time, requests

          client_id = os.environ["CLIENT_ID"].strip()
          client_secret = os.environ["CLIENT_SECRET"].strip()

          res = requests.post("https://oauth2.googleapis.com/device/code", data={
              "client_id": client_id,
              "scope": "https://www.googleapis.com/auth/youtube.upload"
          }).json()

          if "error" in res:
              print("Init Error:", res)
              exit(1)

          device_code = res["device_code"]
          user_code = res["user_code"]
          verification_url = res.get("verification_url", "https://www.google.com/device")
          interval = res.get("interval", 5)

          print("\n" + "="*50)
          print(f"1. افتح الرابط فوراً: {verification_url}")
          print(f"2. ادخل هذا الكود: {user_code}")
          print("="*50 + "\n")
          print("بانتظار تسجيل دخولك وموافقتك...")

          # حلقة انتظار حقيقية حتى تنتهي من المتصفح
          for _ in range(60): # ينتظر حتى 5 دقائق
              time.sleep(interval)
              token_res = requests.post("https://oauth2.googleapis.com/token", data={
                  "client_id": client_id,
                  "client_secret": client_secret,
                  "device_code": device_code,
                  "grant_type": "urn:ietf:params:oauth:grant-type:device_code"
              }).json()

              if "refresh_token" in token_res:
                  print("\n" + "="*50)
                  print("تم استخراج التوكن بنجاح:")
                  print(token_res["refresh_token"])
                  print("="*50 + "\n")
                  break
              
              err = token_res.get("error")
              if err == "authorization_pending":
                  print("لا زال بانتظار الموافقة في المتصفح...")
                  continue
              elif err == "slow_down":
                  time.sleep(interval)
                  continue
              else:
                  print("Error:", token_res)
                  break
          '
